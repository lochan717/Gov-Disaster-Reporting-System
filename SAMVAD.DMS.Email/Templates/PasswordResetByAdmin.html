<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{AppName}} - Password Reset Requested</title>
</head>
<body style="margin:0;padding:0;background:#f3f5f8;font-family:Segoe UI,Arial,sans-serif;color:#17212f;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:24px 12px;">
        <tr>
            <td align="center">
                <table role="presentation" width="620" cellspacing="0" cellpadding="0" style="max-width:620px;background:#ffffff;border:1px solid #d9e2ec;border-radius:10px;overflow:hidden;">
                    <tr>
                        <td style="background:#0f4c81;padding:18px 24px;color:#ffffff;font-size:20px;font-weight:700;">{{AppName}}</td>
                    </tr>
                    <tr>
                        <td style="padding:24px;line-height:1.55;">
                            <p style="margin:0 0 10px 0;">Hello {{RecipientName}},</p>
                            <p style="margin:0 0 14px 0;">A password reset has been initiated for your account by an administrator.</p>
                            <p style="margin:20px 0;">
                                <a href="{{ResetLink}}" style="display:inline-block;background:#0f4c81;color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:6px;font-weight:600;">Reset Password</a>
                            </p>
                            <p style="margin:0 0 10px 0;">If you did not expect this action, contact system support.</p>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:16px 24px;background:#f7fafc;color:#6b7785;font-size:12px;">Copyright {{CurrentYear}} {{AppName}}. All rights reserved.</td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
